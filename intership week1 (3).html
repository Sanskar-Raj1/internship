  <meta charset="UTF-8">

  <title>Contact | Sanskar Raj - Web Developer Portfolio</title>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <nav aria-label="Primary Navigation">
      <a href="index.html" aria-label="Sanskar Raj Home"><strong>Sanskar Raj</strong></a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact Me</h1>
      <p>Fill out the form below to send a message. All required fields are marked.</p>

      <form action="#" method="POST" aria-label="Contact Form">
        <fieldset>
          <legend>Personal Details</legend>

          <div>
            <label for="full-name">Full Name (Required):</label>
            <input type="text" id="full-name" name="full_name" required aria-required="true" autocomplete="name" placeholder="Enter your full name">
          </div>

          <br>

          <div>
            <label for="email-address">Email Address (Required):</label>
            <input type="email" id="email-address" name="email" required aria-required="true" autocomplete="email" placeholder="you@example.com">
          </div>

          <br>

          <div>
            <label for="inquiry-topic">Inquiry Topic:</label>
            <select id="inquiry-topic" name="topic">
              <option value="internship">Internship Opportunity</option>
              <option value="project">Freelance / Project Collaboration</option>
              <option value="general">General Query</option>
            </select>
          </div>
        </fieldset>

        <br>

        <fieldset>
          <legend>Your Message</legend>

          <div>
            <label for="message-box">Message (Required):</label>
            <textarea id="message-box" name="message" rows="5" cols="40" required aria-required="true" placeholder="Write your message here..."></textarea>
          </div>
        </fieldset>

        <br>

        <button type="submit" aria-label="Submit contact form">Send Message</button>
        <button type="reset" aria-label="Clear all form fields">Reset Form</button>
      </form>
    </section>
  </main>

      </ul>
    </nav>
  </footer>
</body>
</html>
